name: Build APK

on:
  push:
    branches: [main, master, tablet-redesign]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Движок Xray (libv2ray.aar) берём из последнего релиза AndroidLibXrayLite
      - name: Download libv2ray.aar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download -R 2dust/AndroidLibXrayLite -p '*.aar' -D app/libs --clobber
          ls -la app/libs
          # приводим имя к ожидаемому
          for f in app/libs/*.aar; do [ "$f" != "app/libs/libv2ray.aar" ] && mv "$f" app/libs/libv2ray.aar; done || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RENT-VPN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
